<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16302b;
      --ink-soft: #3d5a52;
      --paper: #f3f0e8;
      --paper-deep: #e7e1d4;
      --leaf: #2f6f5e;
      --leaf-deep: #1f4f43;
      --mist: rgba(255, 255, 255, 0.55);
      --line: rgba(22, 48, 43, 0.12);
      --danger: #9b3b2e;
      --shadow: 0 18px 40px rgba(22, 48, 43, 0.08);
      --radius: 16px;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Source Sans 3", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(47, 111, 94, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 100%, rgba(163, 120, 72, 0.14), transparent 50%),
        linear-gradient(160deg, #eef3ef 0%, var(--paper) 45%, #ebe4d7 100%);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(22, 48, 43, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22, 48, 43, 0.03) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: none;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, opacity 0.18s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .screen {
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ---------- Login ---------- */
    #login {
      display: grid;
      place-items: center;
      padding: 32px 20px;
      animation: rise-in 0.55s ease both;
    }

    .login-panel {
      width: min(420px, 100%);
      padding: 40px 36px 34px;
      background: var(--mist);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 6vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 10px;
    }

    .login-panel p.lead {
      color: var(--ink-soft);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .field input:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(47, 111, 94, 0.15);
    }

    .btn-primary {
      width: 100%;
      margin-top: 8px;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--leaf);
      color: #f7faf8;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--leaf-deep);
    }

    #message {
      min-height: 1.4em;
      margin-top: 14px;
      color: var(--danger);
      font-size: 0.92rem;
    }

    /* ---------- App shell ---------- */
    #app {
      display: none;
      height: 100vh;
      padding: 18px;
      gap: 16px;
      animation: rise-in 0.45s ease both;
    }

    #app.is-open {
      display: grid;
      grid-template-columns: 300px 1fr;
      transition: grid-template-columns 0.24s ease, gap 0.24s ease;
    }

    #app.is-open.sidebar-collapsed {
      grid-template-columns: 0px 1fr;
      gap: 0;
    }

    .sidebar,
    .editor {
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      transition: opacity 0.2s ease;
    }

    #app.sidebar-collapsed .sidebar {
      opacity: 0;
      pointer-events: none;
      border-color: transparent;
      box-shadow: none;
    }

    .sidebar-top {
      padding: 22px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .sidebar-top .brand {
      font-size: 1.85rem;
      margin-bottom: 0;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: rgba(22, 48, 43, 0.05);
    }

    .expand-sidebar {
      display: none;
      position: fixed;
      left: 28px;
      top: 30px;
      z-index: 4;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .expand-sidebar.is-visible {
      display: inline-flex;
      align-items: center;
    }

    .sidebar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .folder-hint {
      width: 100%;
      margin-top: 2px;
      font-size: 0.8rem;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    .btn-new {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--leaf);
      color: #f7faf8;
      font-weight: 600;
      font-size: 0.92rem;
    }

    .btn-new:hover {
      background: var(--leaf-deep);
    }

    .btn-ghost {
      padding: 10px 12px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      font-weight: 500;
      font-size: 0.92rem;
    }

    .btn-ghost:hover {
      background: rgba(22, 48, 43, 0.05);
    }

    .note-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      list-style: none;
    }

    .note-row,
    .folder-row {
      display: grid;
      align-items: stretch;
      gap: 2px;
      margin-bottom: 6px;
      border-radius: 12px;
      animation: fade-slide 0.28s ease both;
      transition: background 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }

    .note-row {
      grid-template-columns: 22px 1fr 34px;
    }

    .folder-row {
      grid-template-columns: 18px 18px minmax(0, 1fr) auto auto 30px;
      background: rgba(47, 111, 94, 0.05);
    }

    .note-row.depth-1,
    .folder-row.depth-1 {
      margin-left: 16px;
    }

    .note-row.depth-2 {
      margin-left: 32px;
    }

    .note-row:hover,
    .folder-row:hover {
      background: rgba(47, 111, 94, 0.08);
    }

    .note-row.active,
    .folder-row.selected {
      background: rgba(47, 111, 94, 0.14);
    }

    .note-row.dragging,
    .folder-row.dragging {
      opacity: 0.45;
    }

    .note-row.drag-over,
    .folder-row.drag-over,
    .root-drop.drag-over {
      box-shadow: inset 0 2px 0 var(--leaf);
    }

    .note-row.pinned .note-item .title::before,
    .folder-row.pinned .folder-name::before {
      content: "置顶 · ";
      color: var(--leaf-deep);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }

    .chevron,
    .mini-btn {
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--ink-soft);
      border-radius: 8px;
    }

    .chevron {
      width: 18px;
      font-size: 0.72rem;
    }

    .mini-btn {
      width: 22px;
      height: 22px;
      align-self: center;
      font-size: 0.95rem;
      line-height: 1;
    }

    .mini-btn:hover,
    .chevron:hover {
      background: rgba(47, 111, 94, 0.12);
      color: var(--leaf-deep);
    }

    .folder-delete {
      opacity: 0;
      pointer-events: none;
    }

    .folder-row:hover .folder-delete,
    .folder-row:focus-within .folder-delete {
      opacity: 1;
      pointer-events: auto;
    }

    .folder-name {
      width: 100%;
      text-align: left;
      padding: 9px 4px;
      background: transparent;
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-label,
    .root-drop-hint {
      margin: 8px 4px;
      padding: 7px 8px;
      border-radius: 10px;
      color: var(--ink-soft);
      font-size: 0.8rem;
    }

    .group-label {
      letter-spacing: 0.04em;
    }

    .root-drop-hint {
      display: none;
      border: 1px dashed rgba(47, 111, 94, 0.45);
      text-align: center;
    }

    .note-list.is-dragging .root-drop-hint {
      display: block;
    }

    .drag-handle {
      display: grid;
      place-items: center;
      color: rgba(22, 48, 43, 0.35);
      cursor: grab;
      user-select: none;
      font-size: 0.95rem;
      letter-spacing: -0.08em;
      border-radius: 10px 0 0 10px;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .note-item {
      width: 100%;
      text-align: left;
      padding: 11px 8px 10px 4px;
      border-radius: 0;
      background: transparent;
      border: none;
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .note-item .title {
      font-weight: 600;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item .meta {
      font-size: 0.8rem;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pin-btn {
      display: grid;
      place-items: center;
      width: 34px;
      border-radius: 0 10px 10px 0;
      background: transparent;
      color: rgba(22, 48, 43, 0.35);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .pin-btn:hover {
      color: var(--leaf-deep);
      background: rgba(47, 111, 94, 0.1);
    }

    .pin-btn.is-pinned {
      color: var(--leaf-deep);
    }

    .empty-list {
      padding: 28px 16px;
      text-align: center;
      color: var(--ink-soft);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .editor {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    #saveStatus {
      color: var(--ink-soft);
      font-size: 0.9rem;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    #saveStatus.is-saved {
      color: var(--leaf-deep);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    #charCount {
      color: var(--ink-soft);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .toolbar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-save {
      padding: 9px 14px;
      border-radius: 10px;
      background: var(--leaf);
      color: #f7faf8;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-save:hover {
      background: var(--leaf-deep);
    }

    .btn-danger {
      padding: 9px 14px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid rgba(155, 59, 46, 0.28);
      color: var(--danger);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .btn-danger:hover {
      background: rgba(155, 59, 46, 0.08);
    }

    .editor-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 20px 20px;
    }

    #noteTitle {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      padding: 4px 2px;
    }

    #noteTitle::placeholder {
      color: rgba(22, 48, 43, 0.28);
    }

    .format-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px 0 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .format-btn,
    .format-select {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      padding: 0 10px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .format-btn:hover,
    .format-select:hover {
      background: rgba(47, 111, 94, 0.1);
      border-color: rgba(47, 111, 94, 0.28);
    }

    .format-btn.is-italic {
      font-style: italic;
    }

    .format-select {
      cursor: pointer;
      outline: none;
    }

    .format-divider {
      width: 1px;
      height: 22px;
      background: var(--line);
      margin: 0 2px;
    }

    .color-swatches {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px var(--line);
      padding: 0;
    }

    .color-swatch:hover {
      transform: scale(1.08);
    }

    #note {
      flex: 1;
      width: 100%;
      min-height: 240px;
      border: none;
      outline: none;
      background: transparent;
      line-height: 1.7;
      font-size: 1.05rem;
      padding: 4px 2px;
      overflow-y: auto;
      word-break: break-word;
    }

    #note:empty::before {
      content: attr(data-placeholder);
      color: rgba(22, 48, 43, 0.3);
      pointer-events: none;
    }

    #note i,
    #note em {
      font-style: italic;
    }

    #note .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 6px 0;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(47, 111, 94, 0.06);
    }

    #note .todo-item input[type="checkbox"] {
      margin-top: 0.35em;
      width: 1em;
      height: 1em;
      accent-color: var(--leaf);
      flex-shrink: 0;
      cursor: pointer;
    }

    #note .todo-item .todo-text {
      flex: 1;
      outline: none;
      min-width: 0;
    }

    #note .todo-item.is-done .todo-text {
      text-decoration: line-through;
      color: var(--ink-soft);
      opacity: 0.85;
    }

    .editor-empty {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--ink-soft);
      padding: 40px 24px;
      line-height: 1.6;
    }

    .editor-empty strong {
      display: block;
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .hidden {
      display: none !important;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-slide {
      from {
        opacity: 0;
        transform: translateX(-6px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 860px) {
      #app.is-open {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(180px, 32vh) 1fr;
        height: auto;
        min-height: 100vh;
      }

      #app.is-open.sidebar-collapsed {
        grid-template-columns: 1fr;
        grid-template-rows: 0px 1fr;
        gap: 0;
      }

      .sidebar,
      .editor {
        min-height: 0;
      }

      .editor {
        min-height: 60vh;
      }
    }
  </style>
</head>
<body>

  <div id="login" class="screen">
    <div class="login-panel">
      <div class="brand">Notes</div>
      <p class="lead">你的私人记事本。登录后可创建多个编辑框，内容自动保存到云端。</p>

      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn-primary" type="button" onclick="login()">登录</button>
      <p id="message"></p>
    </div>
  </div>

  <div id="app" class="screen">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-heading">
          <div class="brand">Notes</div>
          <button class="btn-icon" type="button" title="折叠列表" onclick="toggleSidebar(true)">‹</button>
        </div>
        <div class="sidebar-actions">
          <button class="btn-new" type="button" onclick="createNote()">新建笔记</button>
          <button class="btn-ghost" type="button" onclick="createFolder()">新建标签</button>
          <button class="btn-ghost" type="button" onclick="logout()">退出</button>
          <p id="folderHint" class="folder-hint">新建笔记将放到：未归类</p>
        </div>
      </div>
      <ul id="noteList" class="note-list"></ul>
    </aside>

    <main class="editor">
      <div id="editorEmpty" class="editor-empty">
        <div>
          <strong>还没有笔记</strong>
          先在左侧选中一个标签，再点「新建笔记」。标签可以展开、收起、置顶和拖动。
        </div>
      </div>

      <div id="editorPanel" class="hidden" style="display: contents;">
        <div class="editor-toolbar">
          <div class="toolbar-left">
            <p id="saveStatus">未保存</p>
            <p id="charCount">汉字 0</p>
          </div>
          <div class="toolbar-right">
            <button class="btn-ghost" id="pinToggleBtn" type="button" onclick="togglePin()">置顶</button>
            <button class="btn-save" type="button" onclick="saveNote()">保存</button>
            <button class="btn-danger" type="button" onclick="deleteNote()">删除</button>
          </div>
        </div>
        <div class="editor-body">
          <input id="noteTitle" type="text" placeholder="无标题" maxlength="120">

          <div class="format-bar">
            <button class="format-btn is-italic" type="button" title="倾斜" onclick="formatItalic()">斜体</button>

            <span class="format-divider"></span>

            <label class="format-select" style="display:inline-flex;align-items:center;gap:6px;padding-right:4px;">
              <span style="font-weight:600;font-size:0.85rem;color:var(--ink-soft);">字号</span>
              <select id="fontSizeSelect" class="format-select" onchange="formatSize(this.value)">
                <option value="">选择</option>
                <option value="0.9rem">小</option>
                <option value="1.05rem">中</option>
                <option value="1.35rem">大</option>
                <option value="1.7rem">特大</option>
              </select>
            </label>

            <span class="format-divider"></span>

            <div class="color-swatches" title="文字颜色">
              <button class="color-swatch" type="button" style="background:#16302b" onclick="formatColor('#16302b')" title="默认"></button>
              <button class="color-swatch" type="button" style="background:#2f6f5e" onclick="formatColor('#2f6f5e')" title="绿色"></button>
              <button class="color-swatch" type="button" style="background:#9b3b2e" onclick="formatColor('#9b3b2e')" title="红色"></button>
              <button class="color-swatch" type="button" style="background:#8a5a12" onclick="formatColor('#8a5a12')" title="棕色"></button>
              <button class="color-swatch" type="button" style="background:#2f5f8a" onclick="formatColor('#2f5f8a')" title="蓝色"></button>
            </div>

            <span class="format-divider"></span>

            <button class="format-btn" type="button" title="插入待办" onclick="insertTodo()">待办勾选</button>
          </div>

          <div
            id="note"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            data-placeholder="开始书写… 可先选中文字再改斜体、颜色或字号"
          ></div>
        </div>
      </div>
    </main>
  </div>

  <button id="expandSidebarBtn" class="expand-sidebar" type="button" title="展开笔记列表" onclick="toggleSidebar(false)">列表 ›</button>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://uvvgafdlkrwluuseqvef.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2dmdhZmRsa3J3bHV1c2VxdmVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1Njk4ODEsImV4cCI6MjA5OTE0NTg4MX0.Q21EsLeel2nIsrxUQpe9_ZDwkvhXId9_FDTAQzXjGkE'
    const supabase = createClient(supabaseUrl, supabaseKey)

    let currentUser = null
    let notes = []
    let folders = []
    let activeNoteId = null
    let activeFolderId = null
    let saveTimer = null
    let isSaving = false
    let dirty = false
    let dragItem = null
    let closedFolderIds = loadClosedFolders()

    const loginEl = document.getElementById('login')
    const appEl = document.getElementById('app')
    const noteListEl = document.getElementById('noteList')
    const noteTitleEl = document.getElementById('noteTitle')
    const noteEl = document.getElementById('note')
    const saveStatusEl = document.getElementById('saveStatus')
    const charCountEl = document.getElementById('charCount')
    const editorEmptyEl = document.getElementById('editorEmpty')
    const editorPanelEl = document.getElementById('editorPanel')
    const messageEl = document.getElementById('message')
    const pinToggleBtn = document.getElementById('pinToggleBtn')
    const folderHintEl = document.getElementById('folderHint')

    function loadClosedFolders() {
      try {
        return new Set(JSON.parse(localStorage.getItem('notes-closed-folders') || '[]').map(String))
      } catch {
        return new Set()
      }
    }

    function setSaveStatus(text, saved = false) {
      saveStatusEl.innerText = text
      saveStatusEl.classList.toggle('is-saved', saved)
    }

    function countHanzi(text) {
      const matches = String(text || '').match(/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/g)
      return matches ? matches.length : 0
    }

    function updateCharCount() {
      const text = noteEl.innerText || ''
      charCountEl.textContent = `汉字 ${countHanzi(text)}`
    }

    function formatTime(value) {
      if (!value) return ''
      return new Date(value).toLocaleString('zh-CN', {
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      })
    }

    function previewText(content) {
      const tmp = document.createElement('div')
      tmp.innerHTML = content || ''
      const text = (tmp.textContent || '').replace(/\s+/g, ' ').trim()
      if (!text) return '空笔记'
      return text.length > 36 ? text.slice(0, 36) + '…' : text
    }

    function looksLikeHtml(content) {
      return /<[a-z][\s\S]*>/i.test(content || '')
    }

    function setEditorContent(content) {
      if (!content) {
        noteEl.innerHTML = ''
        updateCharCount()
        return
      }
      if (looksLikeHtml(content)) {
        noteEl.innerHTML = content
      } else {
        noteEl.innerHTML = escapeHtml(content).replace(/\n/g, '<br>')
      }
      syncTodoStyles()
      updateCharCount()
    }

    function getEditorContent() {
      const text = (noteEl.innerText || '').replace(/\u00a0/g, ' ').trim()
      if (!text && !noteEl.querySelector('.todo-item')) return ''
      return noteEl.innerHTML
    }

    function syncTodoStyles() {
      noteEl.querySelectorAll('.todo-item').forEach((item) => {
        const checkbox = item.querySelector('input[type="checkbox"]')
        item.classList.toggle('is-done', !!(checkbox && checkbox.checked))
      })
    }

    function restoreSelection() {
      noteEl.focus()
    }

    window.formatItalic = function () {
      restoreSelection()
      document.execCommand('italic', false)
      scheduleAutoSave()
    }

    window.formatColor = function (color) {
      restoreSelection()
      document.execCommand('foreColor', false, color)
      scheduleAutoSave()
    }

    window.formatSize = function (size) {
      if (!size) return
      restoreSelection()
      document.execCommand('fontSize', false, '7')
      noteEl.querySelectorAll('font[size="7"]').forEach((fontEl) => {
        const span = document.createElement('span')
        span.style.fontSize = size
        while (fontEl.firstChild) span.appendChild(fontEl.firstChild)
        fontEl.replaceWith(span)
      })
      const select = document.getElementById('fontSizeSelect')
      if (select) select.value = ''
      scheduleAutoSave()
    }

    window.insertTodo = function () {
      restoreSelection()
      const html = `
        <div class="todo-item">
          <input type="checkbox">
          <span class="todo-text">新待办</span>
        </div>
        <div><br></div>
      `
      document.execCommand('insertHTML', false, html)
      const items = noteEl.querySelectorAll('.todo-item .todo-text')
      const last = items[items.length - 1]
      if (last) {
        const range = document.createRange()
        const sel = window.getSelection()
        range.selectNodeContents(last)
        sel.removeAllRanges()
        sel.addRange(range)
      }
      syncTodoStyles()
      scheduleAutoSave()
    }

    function showApp() {
      loginEl.style.display = 'none'
      appEl.style.display = ''
      appEl.classList.add('is-open')
      toggleSidebar(localStorage.getItem('notes-sidebar-collapsed') === '1')
    }

    window.toggleSidebar = function (collapsed) {
      appEl.classList.toggle('sidebar-collapsed', collapsed)
      document.getElementById('expandSidebarBtn').classList.toggle('is-visible', collapsed)
      localStorage.setItem('notes-sidebar-collapsed', collapsed ? '1' : '0')
    }

    function showLogin() {
      appEl.classList.remove('is-open')
      appEl.style.display = 'none'
      loginEl.style.display = 'grid'
    }

    function showEditor(hasNote) {
      editorEmptyEl.classList.toggle('hidden', hasNote)
      editorPanelEl.classList.toggle('hidden', !hasNote)
      if (hasNote) {
        editorPanelEl.style.display = 'contents'
      }
    }

    function getActiveNote() {
      return notes.find((n) => sameId(n.id, activeNoteId)) || null
    }

    function normId(id) {
      return id == null || id === '' ? null : String(id)
    }

    function sameId(a, b) {
      return normId(a) !== null && normId(a) === normId(b)
    }

    function findNote(id) {
      return notes.find((note) => sameId(note.id, id)) || null
    }

    function findFolder(id) {
      return folders.find((folder) => sameId(folder.id, id)) || null
    }

    function compareItem(a, b) {
      const pinDiff = Number(!!b.is_pinned) - Number(!!a.is_pinned)
      if (pinDiff !== 0) return pinDiff
      const orderDiff = (a.sort_order ?? 0) - (b.sort_order ?? 0)
      if (orderDiff !== 0) return orderDiff
      return new Date(b.updated_at || 0) - new Date(a.updated_at || 0)
    }

    function sortItems(list) {
      return [...list].sort(compareItem)
    }

    function nextOrder(list, key, parentVal, pinned) {
      const group = list.filter((item) => normId(item[key]) === normId(parentVal) && !!item.is_pinned === !!pinned)
      if (!group.length) return 0
      return Math.min(...group.map((item) => item.sort_order ?? 0)) - 1
    }

    function renumberGroup(list, key, parentVal) {
      const group = list.filter((item) => normId(item[key]) === normId(parentVal))
      sortItems(group.filter((item) => item.is_pinned)).forEach((item, index) => {
        item.sort_order = index
      })
      sortItems(group.filter((item) => !item.is_pinned)).forEach((item, index) => {
        item.sort_order = index
      })
    }

    function folderHasChildren(folderId) {
      return folders.some((folder) => sameId(folder.parent_id, folderId))
    }

    function isFolderOpen(id) {
      return !closedFolderIds.has(String(id))
    }

    function setFolderOpen(id, open) {
      if (id == null) return
      const key = String(id)
      if (open) closedFolderIds.delete(key)
      else closedFolderIds.add(key)
      localStorage.setItem('notes-closed-folders', JSON.stringify([...closedFolderIds]))
    }

    function revealFolder(folderId) {
      const folder = findFolder(folderId)
      if (!folder) return
      setFolderOpen(folder.id, true)
      if (folder.parent_id) setFolderOpen(folder.parent_id, true)
    }

    function folderPath(folderId) {
      const folder = findFolder(folderId)
      if (!folder) return '未归类'
      if (!folder.parent_id) return folder.name || '未命名标签'
      const parent = findFolder(folder.parent_id)
      return `${parent ? parent.name : '标签'} / ${folder.name || '未命名标签'}`
    }

    function updateFolderHint() {
      if (!folderHintEl) return
      folderHintEl.textContent = `新建笔记将放到：${folderPath(activeFolderId)}`
    }

    function updatePinButton() {
      const note = getActiveNote()
      if (!note) return
      const pinned = !!note.is_pinned
      pinToggleBtn.textContent = pinned ? '取消置顶' : '置顶'
      pinToggleBtn.title = pinned ? '取消在当前标签内的置顶' : '在当前标签内置顶'
    }

    function bindDragSource(handle, item, row) {
      handle.draggable = true
      handle.addEventListener('dragstart', (e) => {
        dragItem = item
        row.classList.add('dragging')
        noteListEl.classList.add('is-dragging')
        e.dataTransfer.effectAllowed = 'move'
        e.dataTransfer.setData('text/plain', JSON.stringify(item))
        e.stopPropagation()
      })
      handle.addEventListener('dragend', () => {
        dragItem = null
        row.classList.remove('dragging')
        noteListEl.classList.remove('is-dragging')
        noteListEl.querySelectorAll('.drag-over').forEach((node) => node.classList.remove('drag-over'))
      })
    }

    function bindDropTarget(el, onDrop) {
      el.addEventListener('dragover', (e) => {
        if (!dragItem) return
        e.preventDefault()
        e.stopPropagation()
        e.dataTransfer.dropEffect = 'move'
        el.classList.add('drag-over')
      })
      el.addEventListener('dragleave', () => {
        el.classList.remove('drag-over')
      })
      el.addEventListener('drop', async (e) => {
        e.preventDefault()
        e.stopPropagation()
        el.classList.remove('drag-over')
        const item = dragItem
        if (!item) return
        await onDrop(item)
      })
    }

    function renderNoteList() {
      noteListEl.innerHTML = ''
      updateFolderHint()

      if (!notes.length && !folders.length) {
        noteListEl.innerHTML = '<li class="empty-list">还没有内容。<br>可以先新建标签，再在标签里新建笔记。</li>'
        showEditor(false)
        return
      }

      sortItems(folders.filter((folder) => !folder.parent_id)).forEach((folder, index) => {
        renderFolderBranch(folder, 0, index)
      })

      const looseNotes = sortItems(notes.filter((note) => !note.folder_id))
      if (looseNotes.length && folders.length) {
        const label = document.createElement('li')
        label.className = 'group-label root-drop'
        label.textContent = '未归类'
        bindDropTarget(label, (item) => moveItemToRoot(item))
        noteListEl.appendChild(label)
      }
      looseNotes.forEach((note, index) => renderNoteRow(note, folders.length ? 1 : 0, index))

      const hint = document.createElement('li')
      hint.className = 'root-drop-hint root-drop'
      hint.textContent = '拖到这里，放到最外层'
      bindDropTarget(hint, (item) => moveItemToRoot(item))
      noteListEl.appendChild(hint)
    }

    function renderFolderBranch(folder, depth, index) {
      const li = document.createElement('li')
      const isPinned = !!folder.is_pinned
      const isChild = depth > 0
      li.className = `folder-row depth-${depth}`
        + (sameId(folder.id, activeFolderId) ? ' selected' : '')
        + (isPinned ? ' pinned' : '')
      li.dataset.id = String(folder.id)
      li.style.animationDelay = `${Math.min(index, 8) * 30}ms`

      const handle = document.createElement('span')
      handle.className = 'drag-handle'
      handle.title = '拖动标签'
      handle.textContent = '⋮⋮'

      const chevron = document.createElement('button')
      chevron.type = 'button'
      chevron.className = 'chevron'
      chevron.title = isFolderOpen(folder.id) ? '收起' : '展开'
      chevron.textContent = isFolderOpen(folder.id) ? '▼' : '▶'
      chevron.addEventListener('click', (e) => {
        e.stopPropagation()
        setFolderOpen(folder.id, !isFolderOpen(folder.id))
        renderNoteList()
      })

      const nameBtn = document.createElement('button')
      nameBtn.type = 'button'
      nameBtn.className = 'folder-name'
      nameBtn.textContent = folder.name || '未命名标签'
      nameBtn.title = '单击选中，双击改名'
      nameBtn.addEventListener('click', () => selectFolder(folder.id))
      nameBtn.addEventListener('dblclick', (e) => {
        e.preventDefault()
        e.stopPropagation()
        renameFolder(folder.id)
      })

      const addChild = document.createElement('button')
      addChild.type = 'button'
      addChild.className = 'mini-btn'
      addChild.title = isChild ? '' : '新建小标签'
      addChild.textContent = isChild ? '' : '+'
      addChild.disabled = isChild
      addChild.style.visibility = isChild ? 'hidden' : 'visible'
      addChild.addEventListener('click', (e) => {
        e.stopPropagation()
        createFolder(folder.id)
      })

      const removeBtn = document.createElement('button')
      removeBtn.type = 'button'
      removeBtn.className = 'mini-btn folder-delete'
      removeBtn.title = '删除标签'
      removeBtn.textContent = '×'
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation()
        deleteFolder(folder.id)
      })

      const pinBtn = document.createElement('button')
      pinBtn.type = 'button'
      pinBtn.className = 'pin-btn' + (isPinned ? ' is-pinned' : '')
      pinBtn.title = isPinned ? '取消置顶' : '置顶标签'
      pinBtn.textContent = isPinned ? '★' : '☆'
      pinBtn.addEventListener('click', (e) => {
        e.stopPropagation()
        toggleFolderPin(folder.id)
      })

      li.append(handle, chevron, nameBtn, addChild, removeBtn, pinBtn)
      bindDragSource(handle, { type: 'folder', id: folder.id }, li)
      bindDropTarget(li, (item) => dropOnFolder(item, folder.id))
      noteListEl.appendChild(li)

      if (!isFolderOpen(folder.id)) return

      sortItems(folders.filter((child) => sameId(child.parent_id, folder.id))).forEach((child, childIndex) => {
        renderFolderBranch(child, depth + 1, childIndex)
      })
      sortItems(notes.filter((note) => sameId(note.folder_id, folder.id))).forEach((note, noteIndex) => {
        renderNoteRow(note, depth + 1, noteIndex)
      })
    }

    function renderNoteRow(note, depth, index) {
      const li = document.createElement('li')
      const isPinned = !!note.is_pinned
      li.className = `note-row depth-${depth}`
        + (sameId(note.id, activeNoteId) ? ' active' : '')
        + (isPinned ? ' pinned' : '')
      li.dataset.id = String(note.id)
      li.style.animationDelay = `${Math.min(index, 8) * 30}ms`

      const handle = document.createElement('span')
      handle.className = 'drag-handle'
      handle.title = '拖动笔记'
      handle.textContent = '⋮⋮'

      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'note-item'
      btn.innerHTML = `
        <span class="title">${escapeHtml(note.title || '无标题')}</span>
        <span class="meta">${formatTime(note.updated_at)} · ${escapeHtml(previewText(note.content))}</span>
      `
      btn.addEventListener('click', () => selectNote(note.id))

      const pinBtn = document.createElement('button')
      pinBtn.type = 'button'
      pinBtn.className = 'pin-btn' + (isPinned ? ' is-pinned' : '')
      pinBtn.title = isPinned ? '取消置顶' : '置顶'
      pinBtn.textContent = isPinned ? '★' : '☆'
      pinBtn.addEventListener('click', (e) => {
        e.stopPropagation()
        togglePin(note.id)
      })

      li.append(handle, btn, pinBtn)
      bindDragSource(handle, { type: 'note', id: note.id }, li)
      bindDropTarget(li, (item) => dropOnNote(item, note.id))
      noteListEl.appendChild(li)
    }

    function updateActiveNotePreview() {
      const note = getActiveNote()
      if (!note) return
      const row = noteListEl.querySelector(`.note-row[data-id="${note.id}"]`)
      if (!row) {
        renderNoteList()
        return
      }
      const title = row.querySelector('.title')
      const meta = row.querySelector('.meta')
      if (title) title.textContent = note.title || '无标题'
      if (meta) meta.textContent = `${formatTime(note.updated_at)} · ${previewText(note.content)}`
    }

    async function persistNotes(list = notes) {
      if (!list.length) return true
      const saveFolder = folders.length > 0 || notes.some((note) => note.folder_id)
      const results = await Promise.all(list.map((note) => {
        const payload = {
          is_pinned: !!note.is_pinned,
          sort_order: note.sort_order ?? 0
        }
        if (saveFolder) payload.folder_id = note.folder_id ?? null
        return supabase
          .from('notes')
          .update(payload)
          .eq('id', note.id)
          .eq('user_id', currentUser.id)
      }))
      const failed = results.find((result) => result.error)
      if (failed?.error) {
        console.error(failed.error)
        setSaveStatus('笔记位置保存失败：' + failed.error.message)
        alert('笔记位置保存失败：' + failed.error.message + '\n\n请确认 notes 表已有 folder_id 字段。')
        return false
      }
      return true
    }

    async function persistFolders(list = folders) {
      if (!list.length) return true
      const results = await Promise.all(list.map((folder) =>
        supabase
          .from('folders')
          .update({
            parent_id: folder.parent_id ?? null,
            is_pinned: !!folder.is_pinned,
            sort_order: folder.sort_order ?? 0,
            name: folder.name
          })
          .eq('id', folder.id)
          .eq('user_id', currentUser.id)
      ))
      const failed = results.find((result) => result.error)
      if (failed?.error) {
        console.error(failed.error)
        setSaveStatus('标签保存失败：' + failed.error.message)
        alert('标签保存失败：' + failed.error.message + '\n\n请先在 Supabase 创建 folders 表。')
        return false
      }
      return true
    }

    async function dropOnNote(item, targetNoteId) {
      if (item.type !== 'note' || sameId(item.id, targetNoteId)) return
      const note = findNote(item.id)
      const target = findNote(targetNoteId)
      if (!note || !target) return

      const oldFolder = note.folder_id ?? null
      note.folder_id = target.folder_id ?? null
      note.is_pinned = !!target.is_pinned
      note.sort_order = (target.sort_order ?? 0) - 0.5
      renumberGroup(notes, 'folder_id', oldFolder)
      renumberGroup(notes, 'folder_id', note.folder_id)
      activeFolderId = note.folder_id ?? null
      revealFolder(note.folder_id)
      renderNoteList()
      await persistNotes(notes)
      setSaveStatus('笔记已移动', true)
    }

    async function dropOnFolder(item, targetFolderId) {
      if (item.type === 'note') {
        const note = findNote(item.id)
        if (!note || sameId(note.folder_id, targetFolderId)) return
        const oldFolder = note.folder_id ?? null
        note.folder_id = targetFolderId
        note.is_pinned = false
        note.sort_order = nextOrder(notes, 'folder_id', targetFolderId, false)
        renumberGroup(notes, 'folder_id', oldFolder)
        renumberGroup(notes, 'folder_id', targetFolderId)
        activeFolderId = targetFolderId
        revealFolder(targetFolderId)
        renderNoteList()
        await persistNotes(notes)
        setSaveStatus('笔记已移动', true)
        return
      }

      if (item.type === 'folder') {
        await dropFolderOnFolder(item.id, targetFolderId)
      }
    }

    async function dropFolderOnFolder(fromId, toId) {
      const source = findFolder(fromId)
      const target = findFolder(toId)
      if (!source || !target || sameId(source.id, target.id)) return
      if (sameId(source.id, target.parent_id)) return

      const oldParent = source.parent_id ?? null
      const sourceIsRoot = !source.parent_id
      const targetIsRoot = !target.parent_id

      if (normId(source.parent_id) === normId(target.parent_id)) {
        source.is_pinned = !!target.is_pinned
        source.sort_order = (target.sort_order ?? 0) - 0.5
        renumberGroup(folders, 'parent_id', oldParent)
      } else if (!sourceIsRoot && targetIsRoot) {
        source.parent_id = target.id
        source.is_pinned = false
        source.sort_order = nextOrder(folders, 'parent_id', target.id, false)
        renumberGroup(folders, 'parent_id', oldParent)
        renumberGroup(folders, 'parent_id', target.id)
        setFolderOpen(target.id, true)
      } else if (!sourceIsRoot && !targetIsRoot) {
        source.parent_id = target.parent_id
        source.is_pinned = !!target.is_pinned
        source.sort_order = (target.sort_order ?? 0) - 0.5
        renumberGroup(folders, 'parent_id', oldParent)
        renumberGroup(folders, 'parent_id', target.parent_id)
        setFolderOpen(target.parent_id, true)
      } else if (sourceIsRoot && !targetIsRoot && !folderHasChildren(source.id)) {
        source.parent_id = target.parent_id
        source.is_pinned = !!target.is_pinned
        source.sort_order = (target.sort_order ?? 0) - 0.5
        renumberGroup(folders, 'parent_id', null)
        renumberGroup(folders, 'parent_id', target.parent_id)
        setFolderOpen(target.parent_id, true)
      } else {
        setSaveStatus('大标签下面如果还有小标签，就不能再拖进别的标签')
        return
      }

      renderNoteList()
      await persistFolders(folders)
      setSaveStatus('标签顺序已更新', true)
    }

    async function moveItemToRoot(item) {
      if (item.type === 'note') {
        const note = findNote(item.id)
        if (!note || !note.folder_id) return
        const oldFolder = note.folder_id
        note.folder_id = null
        note.is_pinned = false
        note.sort_order = nextOrder(notes, 'folder_id', null, false)
        renumberGroup(notes, 'folder_id', oldFolder)
        renumberGroup(notes, 'folder_id', null)
        activeFolderId = null
        renderNoteList()
        await persistNotes(notes)
        setSaveStatus('笔记已移到最外层', true)
        return
      }

      const folder = findFolder(item.id)
      if (!folder || !folder.parent_id) return
      if (folderHasChildren(folder.id)) return
      const oldParent = folder.parent_id
      folder.parent_id = null
      folder.is_pinned = false
      folder.sort_order = nextOrder(folders, 'parent_id', null, false)
      renumberGroup(folders, 'parent_id', oldParent)
      renumberGroup(folders, 'parent_id', null)
      renderNoteList()
      await persistFolders(folders)
      setSaveStatus('标签已移到最外层', true)
    }

    function selectFolder(id) {
      const wasOpen = isFolderOpen(id)
      activeFolderId = id
      setFolderOpen(id, true)
      if (!wasOpen) {
        renderNoteList()
        return
      }
      noteListEl.querySelectorAll('.folder-row').forEach((row) => {
        row.classList.toggle('selected', row.dataset.id === String(id))
      })
      updateFolderHint()
    }

    window.createFolder = async function (parentId = null) {
      if (!currentUser) return
      if (parentId && typeof parentId === 'object') parentId = null

      if (parentId) {
        const parent = findFolder(parentId)
        if (!parent || parent.parent_id) {
          setSaveStatus('只能在大标签下新建小标签')
          return
        }
      }

      const name = prompt(parentId ? '小标签名称' : '大标签名称', parentId ? '新小标签' : '新标签')
      if (!name || !name.trim()) return

      const { data, error } = await supabase
        .from('folders')
        .insert({
          user_id: currentUser.id,
          name: name.trim(),
          parent_id: parentId,
          is_pinned: false,
          sort_order: nextOrder(folders, 'parent_id', parentId, false),
          updated_at: new Date().toISOString()
        })
        .select()
        .single()

      if (error) {
        console.error(error)
        setSaveStatus('新建标签失败：' + error.message)
        alert('新建标签失败：' + error.message + '\n\n请先在 Supabase 创建 folders 表，并给 notes 表加上 folder_id 字段。')
        return
      }

      folders.push(data)
      activeFolderId = data.id
      if (parentId) setFolderOpen(parentId, true)
      setFolderOpen(data.id, true)
      renderNoteList()
      setSaveStatus('标签已创建', true)
    }

    async function renameFolder(folderId) {
      const folder = findFolder(folderId)
      if (!folder) return
      const name = prompt('标签名称', folder.name || '')
      if (!name || !name.trim() || name.trim() === folder.name) return

      const { error } = await supabase
        .from('folders')
        .update({
          name: name.trim(),
          updated_at: new Date().toISOString()
        })
        .eq('id', folder.id)
        .eq('user_id', currentUser.id)

      if (error) {
        console.error(error)
        setSaveStatus('重命名失败：' + error.message)
        return
      }

      folder.name = name.trim()
      renderNoteList()
    }

    async function deleteFolder(folderId) {
      const folder = findFolder(folderId)
      if (!folder) return
      const ok = confirm(`删除标签「${folder.name || '未命名标签'}」？\n里面的笔记和子标签会移到上一级，不会被删除。`)
      if (!ok) return

      const parent = folder.parent_id ?? null
      folders.forEach((item) => {
        if (sameId(item.parent_id, folder.id)) item.parent_id = parent
      })
      notes.forEach((note) => {
        if (sameId(note.folder_id, folder.id)) note.folder_id = parent
      })
      folders = folders.filter((item) => !sameId(item.id, folder.id))
      if (sameId(activeFolderId, folder.id)) activeFolderId = parent
      renumberGroup(folders, 'parent_id', parent)
      renumberGroup(notes, 'folder_id', parent)

      const savedFolders = await persistFolders(folders)
      const savedNotes = await persistNotes(notes)
      if (!savedFolders || !savedNotes) {
        await loadNotes()
        return
      }

      const { error } = await supabase
        .from('folders')
        .delete()
        .eq('id', folder.id)
        .eq('user_id', currentUser.id)

      if (error) {
        console.error(error)
        setSaveStatus('删除标签失败：' + error.message)
        await loadNotes()
        return
      }

      renderNoteList()
      setSaveStatus('标签已删除', true)
    }

    window.toggleFolderPin = async function (folderId) {
      const folder = findFolder(folderId)
      if (!folder) return
      folder.is_pinned = !folder.is_pinned
      folder.sort_order = nextOrder(folders, 'parent_id', folder.parent_id ?? null, folder.is_pinned)
      renumberGroup(folders, 'parent_id', folder.parent_id ?? null)
      renderNoteList()
      await persistFolders(folders.filter((item) => normId(item.parent_id) === normId(folder.parent_id)))
      setSaveStatus(folder.is_pinned ? '标签已置顶' : '已取消标签置顶', true)
    }

    window.togglePin = async function (noteId = activeNoteId) {
      const note = findNote(noteId)
      if (!note) return
      note.is_pinned = !note.is_pinned
      note.sort_order = nextOrder(notes, 'folder_id', note.folder_id ?? null, note.is_pinned)
      renumberGroup(notes, 'folder_id', note.folder_id ?? null)
      renderNoteList()
      updatePinButton()
      await persistNotes(notes.filter((item) => normId(item.folder_id) === normId(note.folder_id)))
      setSaveStatus(note.is_pinned ? '已置顶' : '已取消置顶', true)
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
    }

    function fillEditor(note) {
      if (!note) {
        showEditor(false)
        return
      }
      showEditor(true)
      noteTitleEl.value = note.title || ''
      setEditorContent(note.content || '')
      setSaveStatus('已同步', true)
      dirty = false
      updatePinButton()
    }

    async function loadNotes() {
      const [notesRes, foldersRes] = await Promise.all([
        supabase
          .from('notes')
          .select('*')
          .eq('user_id', currentUser.id),
        supabase
          .from('folders')
          .select('*')
          .eq('user_id', currentUser.id)
      ])

      if (notesRes.error) {
        console.error(notesRes.error)
        setSaveStatus('加载失败：' + notesRes.error.message)
        notes = []
        folders = []
        renderNoteList()
        return
      }

      notes = notesRes.data || []
      if (foldersRes.error) {
        console.error(foldersRes.error)
        folders = []
      } else {
        folders = foldersRes.data || []
      }

      if (!notes.length) {
        activeNoteId = null
        renderNoteList()
        showEditor(false)
        return
      }

      if (!notes.some((n) => sameId(n.id, activeNoteId))) {
        activeNoteId = notes[0].id
      }
      const active = getActiveNote()
      activeFolderId = active?.folder_id ?? null

      renderNoteList()
      fillEditor(active)
    }

    async function selectNote(id) {
      if (sameId(id, activeNoteId)) return

      if (dirty) {
        await saveNote(true)
      }

      activeNoteId = id
      activeFolderId = findNote(id)?.folder_id ?? null
      renderNoteList()
      fillEditor(getActiveNote())
    }

    window.createNote = async function () {
      if (!currentUser) return

      if (dirty) {
        await saveNote(true)
      }

      const folderId = activeFolderId ?? null
      const payload = {
        user_id: currentUser.id,
        title: '无标题',
        content: '',
        is_pinned: false,
        sort_order: nextOrder(notes, 'folder_id', folderId, false),
        updated_at: new Date().toISOString()
      }
      if (folderId) payload.folder_id = folderId

      const { data, error } = await supabase
        .from('notes')
        .insert(payload)
        .select()
        .single()

      if (error) {
        console.error(error)
        setSaveStatus('新建失败：' + error.message)
        alert('新建失败：' + error.message + '\n\n请确认 notes 表已有 folder_id、title、user_id、is_pinned、sort_order 字段。')
        return
      }

      notes.push(data)
      renumberGroup(notes, 'folder_id', folderId)
      activeNoteId = data.id
      revealFolder(folderId)
      renderNoteList()
      fillEditor(data)
      noteTitleEl.focus()
      noteTitleEl.select()
    }

    window.saveNote = async function (silent = false) {
      const note = getActiveNote()
      if (!note || isSaving) return

      const title = noteTitleEl.value.trim() || '无标题'
      const content = getEditorContent()

      isSaving = true
      if (!silent) setSaveStatus('保存中…')

      const { data, error } = await supabase
        .from('notes')
        .update({
          title,
          content,
          updated_at: new Date().toISOString()
        })
        .eq('id', note.id)
        .eq('user_id', currentUser.id)
        .select()
        .single()

      isSaving = false

      if (error) {
        console.error(error)
        setSaveStatus('保存失败：' + error.message)
        return
      }

      const idx = notes.findIndex((n) => n.id === note.id)
      if (idx >= 0) {
        // Keep existing pin/order; only refresh content fields from server
        notes[idx] = {
          ...notes[idx],
          ...data,
          is_pinned: notes[idx].is_pinned,
          sort_order: notes[idx].sort_order,
          folder_id: notes[idx].folder_id
        }
      }

      dirty = false
      setSaveStatus('已自动保存：' + new Date().toLocaleTimeString('zh-CN'), true)
      updateActiveNotePreview()
      updatePinButton()
    }

    window.deleteNote = async function () {
      const note = getActiveNote()
      if (!note) return

      const ok = confirm(`确定删除「${note.title || '无标题'}」吗？此操作不可恢复。`)
      if (!ok) return

      const { error } = await supabase
        .from('notes')
        .delete()
        .eq('id', note.id)
        .eq('user_id', currentUser.id)

      if (error) {
        console.error(error)
        setSaveStatus('删除失败：' + error.message)
        return
      }

      notes = notes.filter((n) => n.id !== note.id)
      activeNoteId = notes[0]?.id ?? null
      dirty = false
      renderNoteList()
      fillEditor(getActiveNote())
    }

    window.login = async function () {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      messageEl.innerText = ''

      const { error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        messageEl.innerText = error.message
        return
      }

      location.reload()
    }

    window.logout = async function () {
      if (dirty) {
        await saveNote(true)
      }
      await supabase.auth.signOut()
      location.reload()
    }

    function scheduleAutoSave() {
      dirty = true
      updateCharCount()
      setSaveStatus('未保存')
      clearTimeout(saveTimer)
      saveTimer = setTimeout(() => {
        saveNote(true)
      }, 3000)
    }

    noteTitleEl.addEventListener('input', scheduleAutoSave)
    noteEl.addEventListener('input', scheduleAutoSave)

    noteEl.addEventListener('click', (e) => {
      if (e.target && e.target.matches('input[type="checkbox"]')) {
        const item = e.target.closest('.todo-item')
        if (item) item.classList.toggle('is-done', e.target.checked)
        scheduleAutoSave()
      }
    })

    noteEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return
      const sel = window.getSelection()
      if (!sel || !sel.anchorNode) return
      const node = sel.anchorNode
      const el = node.nodeType === 1 ? node : node.parentElement
      const todoText = el?.closest('.todo-text')
      if (todoText) {
        e.preventDefault()
        insertTodo()
      }
    })

    async function checkSession() {
      const { data } = await supabase.auth.getSession()
      if (!data.session) {
        showLogin()
        return
      }

      currentUser = data.session.user
      showApp()
      await loadNotes()
    }

    checkSession()
  </script>
</body>
</html>
